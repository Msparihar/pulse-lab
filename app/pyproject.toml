[project]
name = "pulse-lab"
version = "0.2.0"
description = "Near real-time rPPG — heart rate from a 60-second face video"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "open-rppg>=0.1",
    "opencv-python>=4.5",
    "numpy>=1.24",
    # open-rppg imports pkg_resources at runtime but doesn't declare setuptools
    # as a dependency. uv sync into a clean venv leaves it out and the app
    # crashes at startup with ModuleNotFoundError. Pin it here as a workaround.
    "setuptools>=70.0",
]
